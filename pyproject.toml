[project]
name = "imitune-db-manager"
version = "0.1.0"
description = "Dataset processing and embedding extraction for ImiTune"
requires-python = ">=3.10"
dependencies = [
    "datasets<=3.0.0",
    "onnxruntime-gpu>=1.16.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "onnxruntime>=1.16.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.24.0",
    "torch>=2.2.0",
    "transformers>=4.46.0",
    "tqdm>=4.65.0",
    "pinecone>=3.0.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "huggingface-hub>=0.19.0",
    "requests>=2.31.0",
]

[project.scripts]
process-freesound = "process_freesound:main"
process-fsd50k = "process_fsd50k:main"
test-freesound-urls = "test_urls:main"
check-freesound-urls = "check_freesound_urls:main"
analyze-embeddings = "analyze_embeddings:main"
